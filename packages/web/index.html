<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>awesomeness-mgmt</title>
    <script>
      // Paints the ground before the bundle loads, so a cold start is never a white flash.
      // Keys must match src/theme/index.tsx.
      ;(() => {
        try {
          const grounds = { grove: '#1b1a1d', neutral: '#1a1918' }
          const palette = localStorage.getItem('ledger-palette')
          document.documentElement.style.background = grounds[palette] || grounds.grove
        } catch {
          // Storage can throw in a locked-down browser; the default ground is fine.
        }
        document.documentElement.style.colorScheme = 'dark'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
