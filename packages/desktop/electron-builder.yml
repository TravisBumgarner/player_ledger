appId: com.travisbumgarner.player-ledger
productName: Player Ledger
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
# app.ts and main.ts resolve these as siblings of the app directory, as in the repo.
extraResources:
  - from: ../web/dist
    to: web/dist
  - from: ../api/drizzle
    to: api/drizzle
mac:
  target: dir
# The dist script rebuilds better-sqlite3 for Electron itself; this one misses it in a hoisted workspace.
npmRebuild: false
