name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # shared must exist before anything downstream can typecheck.
      - run: npm run build -w @player-ledger/shared

      - run: npm run check

      - run: npm run typecheck

      - run: npm test
